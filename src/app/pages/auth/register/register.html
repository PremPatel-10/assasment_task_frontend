<p-card styleClass="auth-card">
  <div class="auth-brand">
    <i class="pi pi-warehouse"></i>
    <span>Inventory</span>
  </div>
  <p class="auth-subtitle">Create an account</p>
  <p class="auth-hint">New accounts get read-only access — ask an admin to grant Admin access.</p>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="form-body">
    <div class="field">
      <label for="username">Username</label>
      <input pInputText id="username" placeholder="Username" formControlName="username" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <p-password
        inputId="password"
        formControlName="password"
        placeholder="Password"
        [feedback]="false"
        [toggleMask]="true"
        styleClass="w-full"
      ></p-password>
    </div>

    <p-button
      label="Register"
      icon="pi pi-user-plus"
      type="submit"
      styleClass="w-full"
      (onClick)="onSubmit()"
    ></p-button>

    <a routerLink="/login" class="auth-link">Already have an account? Login</a>
  </form>
</p-card>
