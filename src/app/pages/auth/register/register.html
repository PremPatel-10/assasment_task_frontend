<h3>Register</h3>
<p class="text-muted">New accounts get read-only access. Ask an admin to grant Admin access.</p>
<form [formGroup]="registerForm" class="col-md-4">
  <div class="mb-3">
    <label for="username" class="form-label">Username</label>
    <input
      type="text"
      class="form-control"
      id="username"
      placeholder="Username"
      formControlName="username"
    />
  </div>
  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input
      type="password"
      class="form-control"
      id="password"
      placeholder="Password"
      formControlName="password"
    />
  </div>
  <div class="submitBtn">
    <button type="submit" class="btn btn-success me-3" (click)="onSubmit()">Register</button>
    <a routerLink="/login">Already have an account? Login</a>
  </div>
</form>
