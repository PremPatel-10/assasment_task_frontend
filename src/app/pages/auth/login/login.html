<p-card styleClass="auth-card">
  <div class="auth-brand">
    <i class="pi pi-warehouse"></i>
    <span>Inventory</span>
  </div>
  <p class="auth-subtitle">Sign in to manage your inventory</p>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form-body">
    <div class="field">
      <label for="username">Username</label>
      <input pInputText id="username" placeholder="Username" formControlName="username" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <p-password
        inputId="password"
        formControlName="password"
        placeholder="Password"
        [feedback]="false"
        [toggleMask]="true"
        styleClass="w-full"
      ></p-password>
    </div>

    <p-button
      label="Login"
      icon="pi pi-sign-in"
      type="submit"
      styleClass="w-full"
      (onClick)="onSubmit()"
    ></p-button>

    <a routerLink="/register" class="auth-link">Need an account? Register</a>
  </form>
</p-card>
