<form [formGroup]="detailsForm">
  <div class="mb-3">
    <label for="orderId" class="form-label">Enter Order Id</label>
    <input type="text" class="form-control" formControlName="orderId" readonly />
  </div>
  <div class="mb-3">
    <label for="itemId" class="form-label">Enter Item Id</label>
    <select class="form-select" formControlName="itemId">
      <option value="">Select Item</option>

      @for (item of allItems(); track item.itemId) {
        <option [value]="item.itemId">{{ item.itemId }}&nbsp;{{ item.itemName }}</option>
      }
    </select>
  </div>
  <div class="mb-3">
    <label for="price" class="form-label">Enter Price</label>
    <input
      type="number"
      class="form-control"
      id="price"
      placeholder="Price"
      formControlName="price"
      (input)="calculateTotal()"
      required
    />
  </div>
  <div class="mb-3">
    <label for="quantity" class="form-label">Enter Quantity</label>
    <input
      type="number"
      class="form-control"
      id="quantity"
      placeholder="Order Quantity"
      formControlName="quantity"
      (input)="calculateTotal()"
      required
    />
  </div>
  <div class="mb-3">
    <label for="total" class="form-label"> Final Total: {{ Total() }}</label>
  </div>
  <div class="submitBtn">
    <button type="button" class="btn btn-primary me-3" (click)="goBack()">Back</button>
    <button type="button" class="btn btn-success" (click)="onSubmit()">Submit</button>
  </div>
</form>
