<form [formGroup]="detailsForm">
  <div class="mb-3">
    <label for="orderId" class="form-label">Order Id</label>
    <input id="orderId" type="number" class="form-control" formControlName="orderId" readonly />
  </div>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Item</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Total</th>
      </tr>
    </thead>

    <tbody formArrayName="details">
      @for (row of detailsArray.controls; track $index) {
        <tr [formGroupName]="$index">
          <td>
            <select class="form-select" formControlName="itemId">
              <option value="">Select Item</option>

              @for (item of allItems(); track item.itemId) {
                <option [value]="item.itemId">{{ item.itemId }} - {{ item.itemName }}</option>
              }
            </select>
          </td>

          <td>
            <input
              type="number"
              class="form-control"
              formControlName="price"
              (input)="calculateTotal($index)"
            />
          </td>

          <td>
            <input
              type="number"
              class="form-control"
              formControlName="quantity"
              (input)="calculateTotal($index)"
            />
          </td>

          <td>
            <input type="number" class="form-control" formControlName="total" readonly />
          </td>
        </tr>
      }
    </tbody>
  </table>

  <div class="mb-3">
    <button type="button" class="btn btn-primary" (click)="addRow()">Add Row</button>
  </div>

  <div class="submitBtn">
    <button type="button" class="btn btn-secondary me-3" (click)="goBack()">Back</button>
    <button type="button" class="btn btn-success" (click)="saveOrders()">Save Orders</button>
  </div>
</form>
