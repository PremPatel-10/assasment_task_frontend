<h3>Dashboard</h3>

<div class="stat-row">
  <div class="stat-tile">
    <div class="stat-value">{{ totalItems }}</div>
    <div class="stat-label">Total Items</div>
  </div>
  <div class="stat-tile">
    <div class="stat-value">{{ activeItems }}</div>
    <div class="stat-label">Active Items</div>
  </div>
  <div class="stat-tile">
    <div class="stat-value">{{ totalOrders }}</div>
    <div class="stat-label">Total Orders</div>
  </div>
  <div class="stat-tile">
    <div class="stat-value">{{ totalOrderValue }}</div>
    <div class="stat-label">Total Order Value</div>
  </div>
</div>

<div class="chart-row">
  <div class="chart-card">
    <h5>Order Total by Vendor</h5>
    <canvas #vendorCanvas></canvas>
  </div>
  <div class="chart-card">
    <h5>Order Total Over Time</h5>
    <canvas #trendCanvas></canvas>
  </div>
  <div class="chart-card">
    <h5>Item Status</h5>
    <canvas #itemStatusCanvas></canvas>
  </div>
</div>
