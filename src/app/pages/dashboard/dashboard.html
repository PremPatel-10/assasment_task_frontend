<div class="page">
  <h1 class="page-title">Dashboard</h1>

  <div class="stat-row">
    <div class="stat-tile">
      <div class="stat-icon items"><i class="pi pi-box"></i></div>
      <div>
        <div class="stat-value">{{ totalItems }}</div>
        <div class="stat-label">Total Items</div>
      </div>
    </div>
    <div class="stat-tile">
      <div class="stat-icon active"><i class="pi pi-check-circle"></i></div>
      <div>
        <div class="stat-value">{{ activeItems }}</div>
        <div class="stat-label">Active Items</div>
      </div>
    </div>
    <div class="stat-tile">
      <div class="stat-icon orders"><i class="pi pi-shopping-cart"></i></div>
      <div>
        <div class="stat-value">{{ totalOrders }}</div>
        <div class="stat-label">Total Orders</div>
      </div>
    </div>
    <div class="stat-tile">
      <div class="stat-icon value"><i class="pi pi-indian-rupee"></i></div>
      <div>
        <div class="stat-value">{{ totalOrderValue | number }}</div>
        <div class="stat-label">Total Order Value</div>
      </div>
    </div>
  </div>

  <div class="chart-row">
    <div class="chart-card wide">
      <h3>Order Total by Vendor</h3>
      <div class="chart-frame">
        <canvas #vendorCanvas></canvas>
      </div>
    </div>
    <div class="chart-card wide">
      <h3>Order Total Over Time</h3>
      <div class="chart-frame">
        <canvas #trendCanvas></canvas>
      </div>
    </div>
    <div class="chart-card">
      <h3>Item Status</h3>
      <div class="chart-frame small">
        <canvas #itemStatusCanvas></canvas>
      </div>
    </div>
  </div>
</div>
