<dialog [open]="isOpen()">
  <div class="dialog-content">
    <div class="dialog-header">
      <h2>Enter Item Information</h2>
    </div>
    <div class="dialog-body mt-3 mb-3">
      <table cellPadding="4" id="modelTable">
        <tr>
          <th>Item Name</th>
          <td><input type="text" id="inpItemName" placeholder="Enter Item Name" /></td>
        </tr>
        <tr>
          <th>Item Code</th>
          <td><input type="number" id="inpItemCode" placeholder="Enter Item Code" /></td>
        </tr>
      </table>
    </div>
    <div class="dialog-footer">
      <button type="button" class="btn btn-secondary me-2" (click)="isClose.emit()">Close</button>
      <button type="button" class="btn btn-success" (click)="onSubmit()">Save Changes</button>
    </div>
  </div>
</dialog>
