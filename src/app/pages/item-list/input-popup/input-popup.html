<p-dialog
  header="Add Item"
  [visible]="isOpen()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [style]="{ width: '28rem' }"
>
  <form [formGroup]="itemForm" (ngSubmit)="onSubmit()" class="form-body">
    <div class="field">
      <label for="inpItemName">Item Name</label>
      <input
        pInputText
        id="inpItemName"
        placeholder="Enter item name"
        formControlName="itemNameForm"
      />
    </div>
    <div class="field">
      <label for="inpItemCode">Item Code</label>
      <p-inputnumber
        inputId="inpItemCode"
        formControlName="itemCodeForm"
        placeholder="Enter item code"
        [useGrouping]="false"
        styleClass="w-full"
      ></p-inputnumber>
    </div>
  </form>

  <ng-template #footer>
    <p-button
      label="Cancel"
      severity="secondary"
      [outlined]="true"
      (onClick)="isClose.emit()"
    ></p-button>
    <p-button label="Save Item" icon="pi pi-check" (onClick)="onSubmit()"></p-button>
  </ng-template>
</p-dialog>
