<dialog [open]="isOpen()">
  <div class="dialog-content">
    <form [formGroup]="itemForm" (ngSubmit)="onSubmit()">
      <div class="dialog-header">
        <h2>Enter Item Information</h2>
      </div>
      <div class="dialog-body mt-3 mb-3">
        <table cellPadding="4" id="modelTable">
          <tr>
            <th>Item Name</th>
            <td>
              <input
                type="text"
                id="inpItemName"
                placeholder="Enter Item Name"
                formControlName="itemNameForm"
                required
              />
            </td>
          </tr>
          <tr>
            <th>Item Code</th>
            <td>
              <input
                type="number"
                id="inpItemCode"
                placeholder="Enter Item Code"
                formControlName="itemCodeForm"
                required
              />
            </td>
          </tr>
        </table>
      </div>
      <div class="dialog-footer">
        <button type="button" class="btn btn-primary me-2" (click)="isClose.emit()">Close</button>
        <button type="reset" class="btn btn-secondary me-2">Reset</button>
        <button type="submit" class="btn btn-success">Save Changes</button>
      </div>
    </form>
  </div>
</dialog>
