<h2>Order List</h2>
<table cellPadding="8">
  <tr>
    <th>Item Id</th>
    <th>Item Name</th>
    <th>Item Code</th>
  </tr>
  @for (l of items$() | async; track l.itemId) {
    <tr>
      <td>{{ l.itemId }}</td>
      <td>{{ l.itemName }}</td>
      <td>{{ l.itemCode }}</td>
    </tr>
  }
</table>
