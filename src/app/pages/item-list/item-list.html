<h3>Item List</h3>
<div class="heading">
  <input type="text" placeholder="Serch your item" id="searchBar" />
  <button type="button" class="btn btn-sm add" (click)="onSearch()">Search</button>
  <button type="button" class="btn btn-sm add" (click)="isPopupOpen.set(true)">Add Item</button>
</div>
@if (isPopupOpen()) {
  <app-input-popup [isOpen]="isPopupOpen()" (close)="isPopupOpen.set(false)"></app-input-popup>
}

<!-- /*---------------------------------------------------------------------------------------------------*/ -->

<table cellPadding="8">
  <tr>
    <th>Item Id</th>
    <th>Item Name</th>
    <th>Item Code</th>
  </tr>
  @for (l of pageData(); track l.itemId) {
    <tr>
      <td>{{ l.itemId }}</td>
      <td>{{ l.itemName }}</td>
      <td>{{ l.itemCode }}</td>
      <td>
        <button type="button" class="btn btn-danger actionBtn" (click)="onDelete(l.itemId)">
          Delete
        </button>
        <button type="button" class="btn btn-info actionBtn" (click)="onUpdate(l.itemId)">
          Update
        </button>
      </td>
    </tr>
  }
</table>
<ul class="pagination mt-3">
  <li class="page-item">
    <button class="btn btn-warning rounded-end-0" (click)="previousPage()">&laquo;</button>
  </li>
  <li class="page-item">
    <a class="page-link">{{ pageNumber }}</a>
  </li>
  <li class="page-item">
    <button class="btn btn-warning rounded-start-0" (click)="nextPage()">&raquo;</button>
  </li>
</ul>
