<form [formGroup]="itemForm">
  <div class="mb-3">
    <label for="itemName" class="form-label">Enter Item Name</label>
    <input
      type="text"
      class="form-control"
      id="itemName"
      placeholder="Item Name"
      formControlName="itemName"
    />
  </div>
  <div class="mb-3">
    <label for="itemCode" class="form-label">Enter Item Code</label>
    <input
      type="number"
      class="form-control"
      id="itemCode"
      placeholder="Item Code"
      formControlName="itemCode"
    />
  </div>
  <div class="mb-3">
    <label for="isActive" class="form-label">Is this field Active</label>&nbsp;
    <input
      class="form-check-input bg-primary"
      type="checkbox"
      id="isActiveBox"
      formControlName="isActive"
    />
  </div>
  <div class="submitBtn">
    <button type="button" class="btn btn-primary me-3" (click)="backToHomepage()">Back</button>
    <button type="reset" class="btn btn-secondary me-3">Reset</button>
    <button type="submit" class="btn btn-success" (click)="onUpdate()">Submit</button>
  </div>
</form>
