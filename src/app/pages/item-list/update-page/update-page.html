<div class="page narrow">
  <h1 class="page-title">Update Item</h1>

  <p-card>
    <form [formGroup]="itemForm" class="form-body">
      <div class="field">
        <label for="itemName">Item Name</label>
        <input pInputText id="itemName" placeholder="Item Name" formControlName="itemName" />
      </div>
      <div class="field">
        <label for="itemCode">Item Code</label>
        <p-inputnumber
          inputId="itemCode"
          formControlName="itemCode"
          placeholder="Item Code"
          [useGrouping]="false"
          styleClass="w-full"
        ></p-inputnumber>
      </div>

      <div class="form-actions">
        <p-button
          label="Back"
          icon="pi pi-arrow-left"
          severity="secondary"
          [outlined]="true"
          (onClick)="backToHomepage()"
        ></p-button>
        <p-button label="Save Changes" icon="pi pi-check" (onClick)="onUpdate()"></p-button>
      </div>
    </form>
  </p-card>
</div>
