<div class="page narrow">
  <h1 class="page-title">{{ id ? 'Update Order' : 'Add Order' }}</h1>

  <p-card>
    <form [formGroup]="orderForm" class="form-body">
      <div class="field">
        <label for="orderNumber">Order Number</label>
        <p-inputnumber
          inputId="orderNumber"
          formControlName="orderNumber"
          placeholder="Order Number"
          [useGrouping]="false"
          styleClass="w-full"
        ></p-inputnumber>
      </div>
      <div class="field">
        <label for="vendorName">Vendor Name</label>
        <input pInputText id="vendorName" placeholder="Vendor Name" formControlName="vendorName" />
      </div>
      <div class="field">
        <label for="orderDate">Order Date</label>
        <input pInputText type="date" id="orderDate" formControlName="orderDate" />
      </div>
      @if (computedOrderTotal !== null) {
        <div class="field">
          <label for="orderTotal">Order Total (computed from line items)</label>
          <input pInputText id="orderTotal" [value]="computedOrderTotal" readonly />
        </div>
      }

      <div class="form-actions">
        <p-button
          label="Back"
          icon="pi pi-arrow-left"
          severity="secondary"
          [outlined]="true"
          (onClick)="backToHomepage()"
        ></p-button>
        <p-button label="Submit" icon="pi pi-check" (onClick)="onSubmit()"></p-button>
      </div>
    </form>
  </p-card>
</div>
