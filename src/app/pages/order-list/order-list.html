<div class="page">
  <h1 class="page-title">Order List</h1>

  <div class="toolbar">
    <p-iconfield class="search-field">
      <p-inputicon styleClass="pi pi-search" />
      <input
        pInputText
        type="text"
        placeholder="Search your order"
        [formControl]="searchTerm"
        (keyup.enter)="onSearch()"
      />
    </p-iconfield>
    <p-button label="Search" icon="pi pi-search" size="small" (onClick)="onSearch()"></p-button>

    <span class="spacer"></span>

    @if (authService.isAdmin()) {
      <p-button label="Add Order" icon="pi pi-plus" size="small" (onClick)="addOrder()"></p-button>
    }
    <p-button
      label="Export CSV"
      icon="pi pi-file"
      size="small"
      severity="secondary"
      [outlined]="true"
      (onClick)="exportCsv()"
    ></p-button>
    <p-button
      label="Export PDF"
      icon="pi pi-file-pdf"
      size="small"
      severity="secondary"
      [outlined]="true"
      (onClick)="exportPdf()"
    ></p-button>
  </div>

  <p-table
    [value]="pageData()"
    [lazy]="true"
    (onLazyLoad)="onLazyLoad($event)"
    [paginator]="true"
    [rows]="pageSize"
    [totalRecords]="totalOrderCount()"
    [loading]="loading()"
    dataKey="orderId"
    styleClass="p-datatable-sm"
  >
    <ng-template #header>
      <tr>
        <th>Order Id</th>
        <th>Order Number</th>
        <th>Vendor Name</th>
        <th>Order Date</th>
        <th>Order Total</th>
        <th style="width: 15rem"></th>
      </tr>
    </ng-template>
    <ng-template #body let-l>
      <tr>
        <td>{{ l.orderId }}</td>
        <td>{{ l.orderNumber }}</td>
        <td>{{ l.vendorName }}</td>
        <td>{{ l.orderDate }}</td>
        <td>{{ l.orderTotal | number }}</td>
        <td>
          <div class="row-actions">
            @if (authService.isAdmin()) {
              <p-button
                icon="pi pi-pencil"
                size="small"
                severity="info"
                [text]="true"
                (onClick)="onUpdate(l.orderId)"
              ></p-button>
              <p-button
                icon="pi pi-trash"
                size="small"
                severity="danger"
                [text]="true"
                (onClick)="onDelete(l.orderId)"
              ></p-button>
              <p-button
                icon="pi pi-list"
                size="small"
                severity="warn"
                [text]="true"
                (onClick)="goToDetails(l.orderId)"
              ></p-button>
            }
            <p-button
              icon="pi pi-file-excel"
              size="small"
              severity="success"
              [text]="true"
              (onClick)="downloadOrderExcel(l.orderId)"
            ></p-button>
            <p-button
              icon="pi pi-file-pdf"
              size="small"
              severity="danger"
              [text]="true"
              (onClick)="downloadOrderPdf(l.orderId)"
            ></p-button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="6" class="empty-cell">No orders found.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
