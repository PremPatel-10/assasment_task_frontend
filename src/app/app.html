<p-toast position="top-right"></p-toast>
<p-confirmdialog [style]="{ width: '28rem' }"></p-confirmdialog>

@if (authService.isLoggedIn()) {
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <i class="pi pi-warehouse"></i>
        <span>Inventory</span>
      </div>
      <nav class="nav">
        @for (link of navLinks; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          >
            <i [class]="link.icon"></i>
            <span>{{ link.label }}</span>
          </a>
        }
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <div></div>
        <div class="user">
          <p-tag
            [value]="authService.role() ?? ''"
            [severity]="authService.isAdmin() ? 'warn' : 'info'"
          ></p-tag>
          <span class="username">{{ authService.username() }}</span>
          <p-button
            label="Logout"
            icon="pi pi-sign-out"
            severity="secondary"
            [outlined]="true"
            size="small"
            (onClick)="onLogout()"
          ></p-button>
        </div>
      </header>

      <main class="content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
} @else {
  <div class="auth-shell">
    <router-outlet></router-outlet>
  </div>
}
